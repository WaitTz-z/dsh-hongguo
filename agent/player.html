<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>等待时播放</title>
<style>
:root{color-scheme:dark;font:16px/1.55 system-ui;background:#172221;color:#eff6ef}main{max-width:780px;margin:auto;padding:3vh 4vw}h1{font-size:2rem;margin-bottom:.4rem}video{width:100%;max-height:52vh;background:#0a1110;border-radius:12px;display:block}section,form{display:flex;align-items:center;flex-wrap:wrap;gap:.6rem;margin:1rem 0}input,select,button{font:inherit;border:1px solid #788d80;border-radius:6px;padding:.45rem;background:#21342d;color:inherit}input[type=url]{flex:1;min-width:12rem}button{cursor:pointer}a{color:#bde7cc}output{display:block;min-height:1.6em}input[type=file]{max-width:100%}
</style>
<main><h1>等待时播放</h1>
<video controls playsinline preload="metadata"></video>
<form id="source"><input id="url" type="url" aria-label="来源网址" placeholder="粘贴视频或网站地址" required>
<select id="kind" aria-label="来源类型"><option value="auto">自动识别</option><option value="video">视频直链</option><option value="hls">HLS</option><option value="page">普通网页</option></select><button>使用来源</button></form>
<section><label>本地视频 <input id="file" type="file" accept="video/*"></label><a href="/api/hongguo/window">内置剧库</a><a id="external" target="_blank" rel="noopener noreferrer" hidden>打开来源网页</a></section>
<section><label>跟随会话 <select id="session"><option value="">选择已上报的会话</option></select></label><button id="follow">启用跟随</button></section>
<output id="status" aria-live="polite"></output></main>
<script src="/api/hongguo/vendor/hls.light.min.js"></script><script type="module" src="/player.js"></script>
</html>
